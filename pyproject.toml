[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivyroom"
version = "1.0.0"
description = "Portable <2GB RAM Offline Control Room for Unified Vivy + Cautreo (Proprietary 3-Cores-in-1 .vcore & Vivy-Finance-3B-MoE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.scripts]
vivyroom = "vivyroom.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

